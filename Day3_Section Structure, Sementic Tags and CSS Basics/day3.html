    - It helps to define the structure and meaning of the content on a web page. It provides context to search engines

    assistive technologies, making it easier for them to understand the content and its purpose. This can improve
    accessibility for users with disabilities and enhance the overall user experience.
    - It gives meaning to the web page and helps search engines understand the content better. It also improves
    accessibility for users with disabilities.


    header - defines the header section of a web page, which typically contains the site logo, navigation menu, and
    other important information.
    main - defines the main content of a web page, which is unique to that page and should not be repeated on other
    pages.
    footer - defines the footer section of a web page, which typically contains copyright information, links to other
    pages, and other important information.
    strong - defines important text that should be emphasized, typically displayed in bold.
    aside - defines content that is related to the main content of a web page, but is not essential to its
    understanding. It is often used for sidebars, pull quotes, and other supplementary information.
    article - defines a self-contained piece of content that can be distributed and reused independently, such as a blog
    post, news article, or product description. It typically includes a title, author, and publication date, and can be
    shared on social media or other platforms.

    Examples:-

    <header></header>
    <nav></nav>
    <main></main>
