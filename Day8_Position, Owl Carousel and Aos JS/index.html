    <!-- 1. Static.


    2. Relative: The relative class in Tailwind CSS sets an element to position: relative. By itself, it usually doesn't
    move the element. Instead, it creates a positioning context so child elements with absolute are positioned relative
    to it.

    Uses of relative:
    a. Parent for an Absolute Child (Most Common Use)
    b. Overlay Text on an Image
    c. Notification Badge
    d. Dropdown Menu
    e.Tooltip
    f. Slightly Move an Element

    Frequently Used Classes with relative

    Tailwind Class CSS
    relative position: relative;
    absolute position: absolute;
    top-0 top: 0;
    right-0 right: 0;
    bottom-0 bottom: 0;
    left-0 left: 0;
    top-2 top: 0.5rem;
    left-4 left: 1rem;


    3. Absolute: The absolute class in Tailwind CSS sets an element to position: absolute. This removes
    the element from the normal document flow and positions it relative to the nearest parent with relative,
    absolute, fixed, or sticky positioning.

    Uses of absolute:
    a. Place an element in a corner
    b. Center an element
    c. Overlay text on an image
    d. Create notification badges
    e. Create dropdown menus
    f. Build tooltips


    4. Sticky: The sticky class in Tailwind CSS sets an element to position: sticky. A sticky element behaves like a
    normal (relative) element until it reaches a specified scroll position, then it "sticks" in place while the page
    continues to scroll.

    Uses of sticky:
    a. Sticky Navigation Bar
    b. Sticky Sidebar
    c. Sticky Table Header
    d. Sticky Section Heading
    e. Sticky Footer Inside a Scrollable Container

    Common Sticky Position Utilities:
    Tailwind Class CSS
    sticky position: sticky;
    top-0 top: 0;
    top-4 top: 1rem;
    bottom-0 bottom: 0;
    z-10 z-index: 10;
    z-50 z-index: 50;


    5. Fixed: The fixed class in Tailwind CSS sets an element to position: fixed. A fixed element is positioned relative
    to the browser viewport, not its parent. It stays in the same place even when the page is scrolled.

    Common Uses of fixed:
    a. Fixed Navigation Bar
    b. Floating Action Button (FAB)
    c. Back-to-Top Button
    d. Chat Support Button
    e. Full-Screen Modal Background
    f. Cookie Consent Banner
    g. Notification Toast

    Common Fixed Position Utilities:
    Tailwind Class CSS
    fixed position: fixed;
    top-0 top: 0;
    right-0 right: 0;
    bottom-0 bottom: 0;
    left-0 left: 0;
    inset-0 top: 0; right: 0; bottom: 0; left: 0;
    z-10 z-index: 10;
    z-50 z-index: 50;
    
    Summary

    Use fixed when you want an element to stay in the same position on the screen, regardless of scrolling.
    Typical examples include:

    ✅ Fixed navigation bars
    ✅ Floating action buttons (FAB)
    ✅ Back-to-top buttons
    ✅ Chat support widgets
    ✅ Full-screen modal overlays
    ✅ Cookie consent banners
    ✅ Toast notifications  -->
