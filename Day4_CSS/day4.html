<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        .btn_div {
            margin: 100px;
        }

        .btn {
            background-color: #f40909;
            color: white;
            text-decoration: none;
            padding: 16px 40px;
            border-radius: 10px;
            margin-right: 40px;
            transition: 0.3s;
        }

        .btn:hover {
            box-shadow: 5px 5px 5px #c2c0c0;

        }

        .btn2 {
            /* background-color: #f40909; */
            color: #f40909;
            border: 1px solid #f40909;
            text-decoration: none;
            padding: 16px 40px;
            border-radius: 10px;
            box-shadow: 5px 5px 5px #c2c0c0;
            transition: 0.3s;
        }

        .btn2:hover {
            background-color: #f40909;
            color: white;
        }

    </style>
</head>

<body>


    <div class="btn_div">
        <a href="" class="btn">
            View Upcoming Session <i class="fa-solid fa-arrow-right-long"></i>
        </a>
        <a href="" class="btn2">
            View Upcoming Session <i class="fa-solid fa-arrow-right-long"></i>
        </a>
    </div>


</body>

</html>
